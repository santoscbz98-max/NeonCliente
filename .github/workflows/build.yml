
name: Compilar Neon Client

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Compilar client
        run: |
          chmod +x gradlew || true
          gradle build --no-daemon

      - name: Guardar arquivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Client
          path: build/libs/*.jar
          
